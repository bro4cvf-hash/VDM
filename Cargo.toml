[package]
name = "vdm"
version = "0.5.0"
edition = "2021"
description = "Visk Download Manager (VDM) - High-performance native download manager (Rust + Slint)"
authors = ["VDM Team"]

[[bin]]
name = "vdm"
path = "src/main.rs"

[dependencies]
slint = "1.12"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
bytes = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
rand = "0.8"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
rfd = "0.15"
arboard = "3"
i-slint-backend-winit = "=1.17.1"
tray-icon = "0.21"
resvg = "0.45"
windows-sys = { version = "0.59", features = [
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_System_Registry",
    "Win32_Graphics_Gdi",
] }
librqbit = { version = "9.0.1", default-features = false }
librqbit-core = { version = "9.0.1", default-features = false, features = ["sha1-ring"] }
librqbit-sha1-wrapper = { version = "9.0.1", default-features = false, features = ["sha1-ring"] }
urlencoding = "2.1"

[build-dependencies]
slint-build = "1.12"
winresource = "0.1"

[profile.release]
opt-level = 3
lto = "fat"
strip = true
codegen-units = 1
panic = "abort"
